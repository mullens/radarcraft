pluginManagement {
    repositories {
        mavenLocal()
        gradlePluginPortal()
        maven { url = 'https://maven.neoforged.net/releases' }
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'lucas-mc-mods'

include 'level-loss-only'
include 'keyboard-keybinds'
include 'cherished-mobs'
include 'radars'
include 'dev-driver'
