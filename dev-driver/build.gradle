// Dev-only harness. Never published; the jar task is disabled.
//
//   gradlew :dev-driver:runClient -PdriverScript=scripts/driver/keybinds.txt            client script
//   gradlew :dev-driver:runClient -PdriverScript=scripts/driver/park.txt -PserverScript=scripts/driver/server-cherished.txt
//                                                                                      client script + integrated-server script
//   gradlew :dev-driver:runServer -PdriverScript=scripts/driver/server-cherished.txt    headless dedicated server (needs run/eula.txt)
//
// Every run loads ALL mods of this repo. Client runs are muted and windowed by scripts/dev-options.txt
// (re-applied before each launch by the root build), and the driver hides the game window while a
// script runs, so nothing takes focus, grabs the mouse, or appears on screen.

evaluationDependsOn(':level-loss-only')
evaluationDependsOn(':keyboard-keybinds')
evaluationDependsOn(':cherished-mobs')
evaluationDependsOn(':radars')

dependencies {
    implementation project(':level-loss-only')
    implementation project(':keyboard-keybinds')
    implementation project(':cherished-mobs')
    implementation project(':radars')
}

neoForge {
    // Access transformers of the sibling mods must be applied here too, since this project's
    // Minecraft artifact is what the combined run uses.
    accessTransformers.from(file('src/main/resources/META-INF/accesstransformer.cfg'))
    accessTransformers.from(project(':keyboard-keybinds').file('src/main/resources/META-INF/accesstransformer.cfg'))

    mods {
        levellossonly {
            sourceSet(project(':level-loss-only').sourceSets.main)
        }
        keyboardkeybinds {
            sourceSet(project(':keyboard-keybinds').sourceSets.main)
        }
        cherishedmobs {
            sourceSet(project(':cherished-mobs').sourceSets.main)
        }
        radars {
            sourceSet(project(':radars').sourceSets.main)
        }
    }

    runs {
        def script = providers.gradleProperty('driverScript').getOrElse('')
        def serverScript = providers.gradleProperty('serverScript').getOrElse('')
        client {
            if (script) systemProperty 'devdriver.script', rootProject.file(script).absolutePath
            if (serverScript) systemProperty 'devdriver.serverScript', rootProject.file(serverScript).absolutePath
        }
        server {
            if (script) systemProperty 'devdriver.script', rootProject.file(script).absolutePath
        }
    }
}

tasks.named('jar') { enabled = false }
